    <h2>欢迎来到我的像素世界</h2>
    <p>你好！欢迎访问我的个人网站。这个网站的设计灵感来源于经典的 Windows 98 操作系统，并融合了一些现代Web技术。我希望通过这种方式，唤起大家对那个计算时代初期的怀旧之情。</p>
    <img src="https://via.placeholder.com/500x250/a0e7e5/333333?text=Pixel+Art+Banner" alt="文章配图">
    <p>设计这样一个网站不仅仅是为了好玩。它也是一次探索，看看如何在有限的调色板和低分辨率的美学下，构建一个功能齐全、响应式的网站。每一个元素，从窗口边框到字体渲染，都经过了精心调整，以达到最佳像素效果。</p>
    <h3>设计哲学</h3>
    <p>我的核心设计哲学是“功能性怀旧”。这意味着不仅仅是模仿旧界面的外观，更要捕捉其交互的精髓，比如可拖动的窗口和经典的按钮样式。</p>
    <blockquote>
        这是一个引用块的例子。它通常用来强调某段重要的文字或者引用他人的话语。它的样式会略有不同，以示区分。
    </blockquote>
    <p>下面是一个代码块示例，展示了如何用CSS实现像素化的图片渲染：</p>
    <pre><code>html {
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: pixelated;
    -ms-interpolation-mode: nearest-neighbor;
}</code></pre>
