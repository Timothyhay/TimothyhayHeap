layout: pixel
title: Photos - SodaFridge OS
stylesheet: /css/photos.css
javascript: /js/photos.js

<main class="content-area" id="contentArea">
</main>

<template id="galleryWindowTemplate">
    <div class="dialog-box photo-gallery-window">
        <div class="dialog-title-bar">
            <span class="dialog-title">🖼️ Ohh It's Photo Gallery v1.0</span>
            <div class="title-bar-buttons">
                <button class="dialog-maximize-button" title="Maximize">□</button>
                <button class="dialog-close-button">X</button>
            </div>
        </div>
        <div class="dialog-content">
            <div class="photo-grid">
            </div>
        </div>
        <div class="photo-gallery-statusbar">
            <div class="status-section" id="photo-count">0 items</div>
            <div class="status-section">1.44 MB on disk</div>
        </div>
    </div>
</template>

<template id="imageViewerTemplate">
    <div class="dialog-box image-viewer-window">
        <div class="dialog-title-bar">
            <span class="dialog-title">Viewing Image...</span>
            <button class="dialog-close-button">X</button>
        </div>
        <div class="dialog-content">
            <div class="image-container">
                <img src="" alt="Full size photo" class="full-size-photo">
            </div>
            <div class="photo-info">
                <p><strong>Filename:</strong> <span class="info-filename">...</span></p>
                <p><strong>Date Taken:</strong> <span class="info-date">...</span></p>
                <p><strong>Location:</strong> <span class="info-location">...</span></p>
                <p><strong>Lens:</strong> <span class="info-lens">Pixelator 50mm f/1.8</span></p>
            </div>
        </div>
    </div>
</template>

<script>
    const PHOTO_DATA_FROM_JEKYLL = {{ site.data.photos | jsonify }};
</script>
