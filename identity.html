<!DOCTYPE html>
<html lang="zh-CN"> <!-- Sets the language to Simplified Chinese -->
<head>
    <meta charset="UTF-8"> <!-- Specifies character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configures viewport for responsiveness -->
    <title>ZUTOMAYO Inspired Page</title> <!-- Page title -->

    <!-- Google Font for pixelated Latin characters (LOGO) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Link to the external CSS stylesheet -->
    <link rel="stylesheet" href="css/identity.css">
</head>
<body>
<!-- Main LOGO, positioned absolutely to overlap sidebar and content area -->
<h1 class="main-logo">ZUTOMAYO</h1>

<!-- Main container for sidebar and content area -->
<div class="container">
    <!-- Left navigation sidebar -->
    <nav class="sidebar">
        <!-- Navigation list -->
        <ul>
            <!-- Each list item has 'nav-item' class for staggered animation -->
            <li class="nav-item"><a href="https://world.tangerinesoda.fun/">Home</a></li>
            <li class="nav-item"><a href="https://world.tangerinesoda.fun/status">Status</a></li>
            <li class="nav-item"><a href="https://world.tangerinesoda.fun/profile">Biocard</a></li>
            <li class="nav-item"><a href="#">发布</a></li>
            <li class="nav-item"><a href="#">游戏</a></li>
            <li class="nav-item"><a href="#">字体</a></li>
            <li class="nav-item"><a href="#">照片</a></li>
            <li class="nav-item"><a href="#">轮廓</a></li>
            <li class="nav-item"><a href="#">店铺</a></li>
            <li class="nav-item"><a href="#">优质的</a></li>
            <li class="nav-item"><a href="#">注册</a></li>
            <li class="nav-item"><a href="#">登录</a></li>
            <li class="nav-item"><a href="#">噪音</a></li>
            <li class="nav-item"><a href="#">接触</a></li>
        </ul>
        <!-- Social media icons (also animated as a 'nav-item') -->
        <div class="social-icons nav-item">
            <span>▶️</span> <!-- Placeholder YouTube icon -->
            <span>🐦</span> <!-- Placeholder Twitter icon -->
            <span>📷</span> <!-- Placeholder Instagram icon -->
        </div>
        <!-- Copyright notice (also animated) -->
        <div class="copyright nav-item">
            版权所有 2024@ZUTOMAYO
        </div>
        <!-- Language switcher dropdown (also animated) -->
        <div class="language-switcher nav-item">
            <select>
                <option>Chinese (Simplified)</option>
                <option>日本語</option>
                <option>English</option>
            </select>
        </div>
    </nav>

    <!-- Main content display area where dialogs will appear -->
    <main class="content-area" id="contentArea">
        <!-- Placeholder for a background image or art, styled via CSS -->
        <div class="background-art-placeholder">
            <!-- This div can be removed if the background-image on .content-area is sufficient -->
        </div>
    </main>
</div>

<!-- HTML template for the dialog boxes (initially hidden) -->
<template id="dialogTemplate">
    <div class="dialog-box">
        <!-- Dialog title bar: draggable area and close button -->
        <div class="dialog-title-bar">
            <span class="dialog-title">Dialog Title</span> <!-- Title text -->
            <button class="dialog-close-button">X</button> <!-- Close button -->
        </div>
        <!-- Main content area of the dialog -->
        <div class="dialog-content">
            <!-- Dynamic content will be injected here by JavaScript -->
        </div>
        <!-- Button area at the bottom of the dialog -->
        <div class="dialog-buttons">
            <button class="dialog-action-button">はい (Y)</button> <!-- Yes button -->
            <button class="dialog-action-button">いいえ (N)</button> <!-- No button -->
        </div>
    </div>
</template>

<!-- Link to the external JavaScript file -->
<script src="js/identity.js"></script>
</body>
</html>
